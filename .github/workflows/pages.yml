# Publica el laboratorio en GitHub Pages.
# En cada push a main: comprueba las fuentes, ensambla cada exposición y despliega la carpeta _site/.
# Destino en el repositorio: .github/workflows/pages.yml
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, solo se despliega el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El runner ya trae Node y el laboratorio no tiene dependencias: no hace falta instalar nada.
      - name: Comprobar fuentes
        run: |
          node --check escalas/escalas-data.js
          node --check escalas/escalas-icons.js
          node --check escalas/escalas-app.js
          node escalas/escalas-check.js
          node --check luna/luna-data.js
          node --check luna/luna-mapa.js
          node --check luna/luna-astro.js
          node --check luna/luna-render.js
          node --check luna/luna-app.js
          node luna/luna-check.js
          node --check espectro/espectro-fis.js
          node --check espectro/espectro-data.js
          node --check espectro/espectro-app.js
          node --check espectro/espectro-atm-gen.js
          node espectro/espectro-check.js

      # Raíz del sitio = site/ (portada); cada exposición en su carpeta con index.html → URL estable /<exposición>/
      - name: Ensamblar el sitio
        run: |
          mkdir -p _site
          cp -r site/. _site/
          node escalas/escalas-build.js _site/ordenes-de-magnitud/index.html
          node luna/luna-build.js _site/la-misma-luna/index.html
          node espectro/espectro-build.js _site/el-espectro/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
